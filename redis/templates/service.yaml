apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: redis
spec:
  selector:
    # labels are used as selectors
    project: roboshop
    tier: db
    component: redis
  ports:
  - protocol: TCP
    port: 6379 # servie port
    targetPort: 6379 # container port